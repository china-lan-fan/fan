name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 代码格式检查（gofmt）
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$out"
            exit 1
          fi
      - name: 静态检查（go vet）
        run: go vet ./...
      - name: 单元测试（go test）
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: 编译当前平台
        run: go build -trimpath -ldflags="-s -w -X main.version=ci-${{ github.sha }}" -o fan ./cmd/fan
      - name: 验证编译产物
        run: ./fan version

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 交叉编译 ${{ matrix.target }}
        env:
          CGO_ENABLED: 0
        run: |
          os="${{ matrix.target%%-*}}"
          arch="${{ matrix.target##*-}}"
          ext=""
          if [ "$os" = "windows" ]; then ext=".exe"; fi
          GOOS="$os" GOARCH="$arch" go build -trimpath \
            -ldflags="-s -w -X main.version=ci-${{ github.sha }}" \
            -o "fan-${os}-${arch}${ext}" ./cmd/fan
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: fan-${{ matrix.target }}
          path: fan-*
          retention-days: 7
